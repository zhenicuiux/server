name: Keep Server Alive Ping

on:
  schedule:
    # اجرا در هر ۶ ساعت به صورت خودکار
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Server URL
        run: |
          echo "Pinging server to prevent sleep..."
          # آدرس دامنه یا آی‌پی سرور خود را در بخش زیر یا در Secret قرار دهید
          # curl -s -o /dev/null -w "%{http_code}" https://your-server-domain.com/health || true
          echo "Keep-alive ping completed."
